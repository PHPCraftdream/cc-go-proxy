name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A newer push supersedes older runs of the same ref instead of queueing behind them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # setup-go restores and saves the module and build caches itself.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Download dependencies
      run: go mod download

    # ccgp targets Windows first: its DACL, junction and detached-process code only runs there.
    - name: Run tests
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          go test -v -race -coverprofile=coverage.out ./...
        else
          go test -v ./...
        fi

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      if: runner.os == 'Linux'
      with:
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: false

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Build binary
      run: |
        ext=""
        if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
        go build -ldflags "-s -w" -o "ccgp-ci$ext" ./cmd/ccgp
        ./ccgp-ci --version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
        args: --timeout=5m

  # The release builds six platforms; type-check all of them on every push so a
  # darwin or arm64 break shows up here and not on release day.
  cross:
    name: Vet ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [ linux/arm64, darwin/amd64, darwin/arm64, windows/arm64 ]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: go vet
      env:
        CGO_ENABLED: '0'
      run: |
        target='${{ matrix.target }}'
        GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./cmd/... ./internal/...

  npm-scripts:
    name: npm packaging scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - run: node --test "scripts/npm/*.test.mjs"

  # The installers download the published release, so this checks them against
  # what users really get: a pinned version and the latest one.
  installers:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: shellcheck
      if: runner.os == 'Linux'
      run: shellcheck install.sh

    - name: install.sh
      if: runner.os != 'Windows'
      env:
        CCGP_INSTALL_DIR: ${{ runner.temp }}/ccgp-bin
      run: |
        set -eu
        CCGP_VERSION=0.1.1 sh install.sh
        [ "$("$CCGP_INSTALL_DIR/ccgp" --version)" = "ccgp v0.1.1" ]
        "$CCGP_INSTALL_DIR/ccgpy" help | grep -q '^usage: ccgpy <profile>'
        # Again without a version (the latest release), over the installed binaries.
        sh install.sh
        "$CCGP_INSTALL_DIR/ccgp" --version
        # ... and it must be the newest published release.
        want="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/PHPCraftdream/cc-go-proxy/releases/latest)"
        [ "$("$CCGP_INSTALL_DIR/ccgp" --version)" = "ccgp v${want##*/v}" ]

    - name: install.ps1
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CCGP_INSTALL_DIR: ${{ runner.temp }}\ccgp-bin
        CCGP_NO_PATH: '1'
      run: |
        $ErrorActionPreference = 'Stop'
        $env:CCGP_VERSION = '0.1.1'
        ./install.ps1
        $v = & "$env:CCGP_INSTALL_DIR\ccgp.exe" --version
        if ($v -ne 'ccgp v0.1.1') { throw "version is '$v'" }
        & "$env:CCGP_INSTALL_DIR\ccgpy.exe" help | Select-String -Pattern '^usage: ccgpy <profile>' -Quiet | ForEach-Object { if (-not $_) { throw 'ccgpy help' } }
        # Again without a version (the latest release), over the installed binaries.
        Remove-Item Env:CCGP_VERSION
        ./install.ps1
        $v = & "$env:CCGP_INSTALL_DIR\ccgp.exe" --version
        $v
        # ... and it must be the newest published release.
        $latest = Invoke-RestMethod -UseBasicParsing -Uri 'https://api.github.com/repos/PHPCraftdream/cc-go-proxy/releases/latest' -Headers @{ 'User-Agent' = 'ccgp-ci' }
        $want = 'ccgp v' + ([string]$latest.tag_name).TrimStart('v')
        if ($v -ne $want) { throw "latest release is '$want' but the installer put '$v'" }
