name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # A manual run from the Actions tab: the whole suite.
  workflow_dispatch:

permissions:
  contents: read

# A newer pull request push supersedes the older run: its diff covers the older one's.
# A push to main is tested by its own diff only, so no run may be cancelled in favour of a newer one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # the diff against the previous push picks the tests

    # setup-go restores and saves the module and build caches itself.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Download dependencies
      run: go mod download

    # ccgp targets Windows first: its DACL, junction and detached-process code only runs there.
    # Only the packages a change can affect are tested: the changed ones and everything that
    # imports them (scripts/ci/affected.mjs). The whole suite runs for a manual run, a
    # change of go.mod, go.sum or CI itself, and when the head commit message of a push
    # holds "[ci full]". Releases always run it all.
    - name: Run tests
      id: tests
      env:
        CI_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        COMMIT_MESSAGE: ${{ github.event_name == 'push' && github.event.head_commit.message || '' }}
      run: bash scripts/ci/tests.sh

    # A partial run would overwrite the coverage with a fraction of it.
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      if: runner.os == 'Linux' && steps.tests.outputs.full == 'true'
      with:
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: false

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Build binary
      run: |
        ext=""
        if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
        go build -ldflags "-s -w" -o "ccgp-ci$ext" ./cmd/ccgp
        ./ccgp-ci --version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
        args: --timeout=5m

  # The release builds ten platforms; type-check all of them on every push so a
  # darwin or arm64 break shows up here and not on release day.
  cross:
    name: Vet ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [ linux/arm64, linux/arm, linux/riscv64, freebsd/amd64, freebsd/arm64, darwin/amd64, darwin/arm64, windows/arm64 ]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: go vet
      env:
        CGO_ENABLED: '0'
      run: |
        target='${{ matrix.target }}'
        GOOS="${target%/*}" GOARCH="${target#*/}" GOARM=6 go vet ./cmd/... ./internal/...

  # "Works everywhere": the Linux binaries have no libc dependency, so one build
  # serves glibc and musl systems alike. This checks it instead of assuming it:
  # no dynamic loader or shared library, and real runs on Alpine (musl), old
  # Debian and Ubuntu (glibc), and a container with no root certificates at all.
  portable:
    name: Portable Linux binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Build
      env:
        CGO_ENABLED: '0'
      run: |
        set -eu
        for arch in amd64 arm64 arm riscv64; do
          GOOS=linux GOARCH=$arch GOARM=6 go build -trimpath -ldflags "-s -w" -o "out/ccgp-$arch" ./cmd/ccgp
        done

    - name: Statically linked
      run: |
        set -eu
        for f in out/ccgp-*; do
          if readelf -l "$f" | grep -q INTERP; then echo "$f asks for a dynamic loader"; exit 1; fi
          if readelf -d "$f" 2>/dev/null | grep -q NEEDED; then echo "$f needs shared libraries"; exit 1; fi
          echo "static: $f"
        done

    - name: Runs on musl and on old glibc
      run: |
        set -eu
        for image in alpine:3.19 debian:bullseye-slim ubuntu:20.04 busybox; do
          echo "== $image"
          docker run --rm -v "$PWD/out:/o:ro" "$image" /o/ccgp-amd64 --version
        done

    - name: Runs on other CPUs
      run: |
        set -eu
        docker run --privileged --rm tonistiigi/binfmt --install arm64,arm >/dev/null
        docker run --rm --platform linux/arm64 -v "$PWD/out:/o:ro" alpine:3.19 /o/ccgp-arm64 --version
        docker run --rm --platform linux/arm/v7 -v "$PWD/out:/o:ro" alpine:3.19 /o/ccgp-arm --version

    # busybox has no root certificates; HTTPS must still work through the bundled ones.
    - name: HTTPS without a certificate store
      run: |
        set -eu
        docker run --rm busybox sh -c 'ls /etc/ssl/certs 2>&1 | head -1; test -e /etc/ssl/certs/ca-certificates.crt && echo "this image has a CA bundle now" || echo "no CA bundle: as intended"'
        # Any answer from github.com proves the TLS handshake worked; "no release yet" is one.
        out="$(docker run --rm -e HOME=/tmp -v "$PWD/out:/o:ro" busybox /o/ccgp-amd64 --update --check 2>&1)" || true
        echo "$out"
        echo "$out" | grep -Eq 'is up to date|update available|is newer than the latest release|cannot find the latest release \(got "https://github.com/'

  npm-scripts:
    name: npm packaging scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - run: node --test "scripts/npm/*.test.mjs" "scripts/ci/*.test.mjs"

  # The installers download the published release, so this checks them against
  # what users really get: a pinned version and the latest one.
  installers:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: shellcheck
      if: runner.os == 'Linux'
      run: shellcheck install.sh

    - name: install.sh
      if: runner.os != 'Windows'
      env:
        CCGP_INSTALL_DIR: ${{ runner.temp }}/ccgp-bin
      run: |
        set -eu
        # The newest published release, asked for by its version.
        want="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/PHPCraftdream/cc-go-proxy/releases/latest)"
        case "$want" in
          */releases/tag/v*) ;;
          *) echo "::notice::no release is published yet: nothing to install"; exit 0 ;;
        esac
        ver="${want##*/v}"
        CCGP_VERSION="$ver" sh install.sh
        [ "$("$CCGP_INSTALL_DIR/ccgp" --version)" = "ccgp v$ver" ]
        "$CCGP_INSTALL_DIR/ccgpy" help | grep -q '^usage: ccgpy <profile>'
        # Again without a version, over the installed binaries: it must be the same release.
        sh install.sh
        [ "$("$CCGP_INSTALL_DIR/ccgp" --version)" = "ccgp v$ver" ]

    - name: install.ps1
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CCGP_INSTALL_DIR: ${{ runner.temp }}\ccgp-bin
        CCGP_NO_PATH: '1'
      run: |
        $ErrorActionPreference = 'Stop'
        # The newest published release, asked for by its version.
        try {
          $latest = Invoke-RestMethod -UseBasicParsing -Uri 'https://api.github.com/repos/PHPCraftdream/cc-go-proxy/releases/latest' -Headers @{ 'User-Agent' = 'ccgp-ci' }
        } catch {
          if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          Write-Host '::notice::no release is published yet: nothing to install'
          exit 0
        }
        $ver = ([string]$latest.tag_name).TrimStart('v')
        $env:CCGP_VERSION = $ver
        ./install.ps1
        $v = & "$env:CCGP_INSTALL_DIR\ccgp.exe" --version
        if ($v -ne "ccgp v$ver") { throw "version is '$v', wanted 'ccgp v$ver'" }
        & "$env:CCGP_INSTALL_DIR\ccgpy.exe" help | Select-String -Pattern '^usage: ccgpy <profile>' -Quiet | ForEach-Object { if (-not $_) { throw 'ccgpy help' } }
        # Again without a version, over the installed binaries: it must be the same release.
        Remove-Item Env:CCGP_VERSION
        ./install.ps1
        $v = & "$env:CCGP_INSTALL_DIR\ccgp.exe" --version
        if ($v -ne "ccgp v$ver") { throw "latest release is 'ccgp v$ver' but the installer put '$v'" }
