name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A newer push supersedes older runs of the same ref instead of queueing behind them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # setup-go restores and saves the module and build caches itself.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Download dependencies
      run: go mod download

    # ccgp targets Windows first: its DACL, junction and detached-process code only runs there.
    - name: Run tests
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          go test -v -race -coverprofile=coverage.out ./...
        else
          go test -v ./...
        fi

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      if: runner.os == 'Linux'
      with:
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: false

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Build binary
      run: |
        ext=""
        if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
        go build -ldflags "-s -w" -o "ccgp-ci$ext" ./cmd/ccgp
        ./ccgp-ci version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
        args: --timeout=5m

  # The release builds six platforms; type-check all of them on every push so a
  # darwin or arm64 break shows up here and not on release day.
  cross:
    name: Vet ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [ linux/arm64, darwin/amd64, darwin/arm64, windows/arm64 ]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: go vet
      env:
        CGO_ENABLED: '0'
      run: |
        target='${{ matrix.target }}'
        GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./cmd/... ./internal/...

  npm-scripts:
    name: npm packaging scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - run: node --test "scripts/npm/*.test.mjs"
