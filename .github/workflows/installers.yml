name: Installers

# The installers download the published release, so this checks them against what users really get:
# a pinned version and the latest one. A code change cannot break them, so it is not part of CI:
# it runs when an installer changes, weekly, and by hand. The macOS runner pool is often short of
# capacity; a job it never starts shows as cancelled, so re-run it (the main CI is not held up by it).
on:
  push:
    branches: [ main ]
    paths:
      - install.sh
      - install.ps1
      - .github/workflows/installers.yml
  pull_request:
    branches: [ main ]
    paths:
      - install.sh
      - install.ps1
      - .github/workflows/installers.yml
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installers:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: shellcheck
      if: runner.os == 'Linux'
      run: shellcheck install.sh

    - name: install.sh
      if: runner.os != 'Windows'
      env:
        CCGP_INSTALL_DIR: ${{ runner.temp }}/ccgp-bin
      run: |
        set -eu
        # The newest published release, asked for by its version.
        want="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/PHPCraftdream/cc-go-proxy/releases/latest)"
        case "$want" in
          */releases/tag/v*) ;;
          *) echo "::notice::no release is published yet: nothing to install"; exit 0 ;;
        esac
        ver="${want##*/v}"
        CCGP_VERSION="$ver" sh install.sh
        [ "$("$CCGP_INSTALL_DIR/ccgp" --version)" = "ccgp v$ver" ]
        "$CCGP_INSTALL_DIR/ccgpy" help | grep -q '^usage: ccgpy '
        # Again without a version, over the installed binaries: it must be the same release.
        sh install.sh
        [ "$("$CCGP_INSTALL_DIR/ccgp" --version)" = "ccgp v$ver" ]

    - name: install.ps1
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CCGP_INSTALL_DIR: ${{ runner.temp }}\ccgp-bin
        CCGP_NO_PATH: '1'
      run: |
        $ErrorActionPreference = 'Stop'
        # The newest published release, asked for by its version.
        # /releases/latest redirects to /releases/tag/vX.Y.Z (to /releases without one); no API rate limit applies.
        $req = [Net.HttpWebRequest]::Create('https://github.com/PHPCraftdream/cc-go-proxy/releases/latest')
        $req.Method = 'HEAD'; $req.AllowAutoRedirect = $false; $req.UserAgent = 'ccgp-ci'
        $res = $req.GetResponse()
        try { $location = [string]$res.Headers['Location'] } finally { $res.Close() }
        if ($location -notmatch '/releases/tag/v') {
          Write-Host '::notice::no release is published yet: nothing to install'
          exit 0
        }
        $ver = ($location -split '/')[-1].TrimStart('v')
        $env:CCGP_VERSION = $ver
        ./install.ps1
        $v = & "$env:CCGP_INSTALL_DIR\ccgp.exe" --version
        if ($v -ne "ccgp v$ver") { throw "version is '$v', wanted 'ccgp v$ver'" }
        & "$env:CCGP_INSTALL_DIR\ccgpy.exe" help | Select-String -Pattern '^usage: ccgpy ' -Quiet | ForEach-Object { if (-not $_) { throw 'ccgpy help' } }
        # Again without a version, over the installed binaries: it must be the same release.
        Remove-Item Env:CCGP_VERSION
        ./install.ps1
        $v = & "$env:CCGP_INSTALL_DIR\ccgp.exe" --version
        if ($v -ne "ccgp v$ver") { throw "latest release is 'ccgp v$ver' but the installer put '$v'" }
